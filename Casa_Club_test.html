<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263b35">
<title>CASA CLUB — La casa è una squadra</title>
<style>
:root{--bg:#f3f1e9;--paper:#fffefa;--ink:#263b35;--muted:#78837a;--green:#526f5d;--green2:#e4ebe2;--line:#e4e1d7;--gold:#c69b50;--red:#a85649;--shadow:0 8px 28px #263b350d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:11px}.mark{width:43px;height:43px;border-radius:15px;background:var(--ink);color:#f6f2e8;display:grid;place-items:center;font:700 21px Georgia}.brand strong{display:block;font:700 19px Georgia;letter-spacing:.08em}.brand small{color:var(--muted);font-size:11px;letter-spacing:.03em}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
h1{font:600 27px/1.15 Georgia,serif;margin:4px 0 7px}h2{font:600 18px Georgia;margin:22px 0 10px}h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.profiles{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.profile{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 13px;white-space:nowrap;color:var(--ink)}.profile.active{background:var(--ink);color:#fffefa;border-color:var(--ink)}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffefaee;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;justify-content:center;gap:4px}
nav button{flex:1;max-width:120px;border:0;background:transparent;color:var(--muted);border-radius:13px;padding:8px 3px;font-size:11px}nav button span{display:block;font-size:19px;margin-bottom:1px}nav button.active{background:var(--green2);color:var(--ink);font-weight:700}
.btn{border:0;background:var(--ink);color:#fffefa;border-radius:12px;padding:10px 14px;font-weight:650}.btn.secondary{background:var(--green2);color:var(--ink)}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#f7e9e5;color:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}
.big{font:700 37px Georgia;letter-spacing:-.03em}.pill{display:inline-flex;background:var(--green2);color:var(--green);border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.progress{height:9px;border-radius:99px;background:#e9e7de;overflow:hidden;margin:9px 0}.progress>i{display:block;height:100%;background:var(--green);border-radius:99px}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:6px 0;text-align:left;color:var(--ink)}.task b{font-weight:600}.task small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.task .pts{color:var(--green);font-weight:750;white-space:nowrap}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fffefa;color:var(--ink);min-width:0}label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin:10px 0 5px}.fieldrow{display:grid;grid-template-columns:1fr 100px;gap:8px}
.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}
.notice{background:#f5efdf;border:1px solid #e9dfc8;border-radius:15px;padding:13px;color:#695532;font-size:13px;margin:12px 0}
.empty{padding:25px 12px;text-align:center;color:var(--muted)}.muted{color:var(--muted)}.small{font-size:12px}.rank{font:700 20px Georgia;color:var(--gold);width:26px}.avatar{width:36px;height:36px;border-radius:13px;background:var(--green2);display:grid;place-items:center;font-weight:750}
.modal{position:fixed;inset:0;background:#14211dcc;z-index:20;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{width:min(100%,560px);background:var(--paper);border-radius:23px 23px 16px 16px;padding:20px;max-height:90dvh;overflow:auto}.sheet h2{margin:0 0 10px}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(85px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:white;border-radius:99px;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media(min-width:650px){main{padding-top:28px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .card{margin:0}}
</style>
</head>
<body>
<main>
<header><div class="brand"><div class="mark">C</div><div><strong>CASA CLUB</strong><small>LA CASA È UNA SQUADRA. OGNI GESTO CONTA.</small></div></div><button class="btn ghost" id="settingsShortcut" aria-label="Impostazioni">⚙</button></header>
<div id="app"></div>
</main>
<nav id="nav"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='casa_club_local_v1', OLD='faccende_v1';
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monday=t=>{let d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return +d};
const fmt=t=>new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
const ADULT=[
['Cucina',[['Cucinare pranzo o cena',15],['Apparecchiare e sparecchiare',4],['Lavare i piatti',6],['Caricare o svuotare la lavastoviglie',4],['Pulire il piano cottura',8],['Pulire il frigorifero',15],['Pulire il forno',20]]],
['Bucato',[['Fare lavatrice e stendere',7],['Ritirare e piegare i panni',7],['Stirare',12],['Cambiare le lenzuola',10]]],
['Pulizie',[['Passare l’aspirapolvere',10],['Lavare i pavimenti',15],['Pulire il bagno',18],['Spolverare',8],['Pulire i vetri',15],['Fare i letti',3],['Riordinare gli ambienti',5],['Pulire il balcone',12]]],
['Altro',[['Fare la spesa',12],['Portare fuori la spazzatura',3],['Svuotare i cestini',2],['Annaffiare le piante',2]]]
];
const CHILD=[['Camera e ordine',[['Riordinare i giochi',5],['Sistemare il letto',3],['Mettere a posto scarpe e giacca',3],['Preparare lo zaino',5],['Piegare i propri vestiti',5]]],['Aiuto in famiglia',[['Apparecchiare la tavola',4],['Aiutare a sparecchiare',4],['Aiutare in cucina con un adulto',5],['Dare da mangiare all’animale (se previsto)',3]]]];
const ADULT_REWARDS=[['Scegliere il film della serata',30],['Colazione a letto',50],['Massaggio di 20 minuti',60],['Una giornata senza faccende',120],['Cena fuori scelta da me',180],['Regalo a sorpresa',350]];
const CHILD_REWARDS=[['30 minuti di gioco extra',30],['Scegliere il film',40],['Paghetta da 5 €',50],['Uscita speciale',100],['Esperienza speciale',300],['Nuovo videogame',400]];
function defaults(){return {version:2,people:[{id:'p1',name:'Adulto 1',type:'adult',age:35},{id:'p2',name:'Adulto 2',type:'adult',age:35},{id:'c1',name:'Figlio 1',type:'child',age:8}],current:'p1',tasks:[...ADULT.flatMap(([g,a])=>a.map(([name,points])=>({id:uid(),group:g,name,points,for:'adult'}))),...CHILD.flatMap(([g,a])=>a.map(([name,points])=>({id:uid(),group:g,name,points,for:'child'})))],pending:[],approved:[],rejected:[],redeems:[],rewards:[...ADULT_REWARDS.map(([name,cost])=>({id:uid(),name,cost,for:'adult'})),...CHILD_REWARDS.map(([name,cost])=>({id:uid(),name,cost,for:'child'}))],team:{goal:250,week:monday(Date.now()),prize:'Serata in famiglia scelta da tutti'},weeks:[],settings:{weeklyBonus:20,maxRedeems:2,childTargets:{small:25,medium:40,teen:55},theme:'light'},events:[],settledWeeks:[]};}
function migrateOld(o){const d=defaults();if(!o)return d;try{d.people=(o.players||d.people).map((p,i)=>({id:p.id||uid(),name:p.name||`Partecipante ${i+1}`,type:'adult',age:30}));d.current=o.cur||d.people[0].id;d.tasks=(o.tasks||[]).map(t=>({id:t.id||uid(),group:t.g||'Altro',name:t.name,points:t.points,for:'adult'})).concat(d.tasks.filter(t=>t.for==='child'));d.approved=(o.logs||[]).map(l=>({id:l.id||uid(),taskId:l.taskId,name:l.name,points:l.points,by:l.by,at:l.ts||Date.now(),week:monday(l.ts||Date.now()),approvedBy:l.by,legacy:true}));d.redeems=(o.redeems||[]).map(r=>({...r,for:'adult'}));d.rewards=(o.rewards||[]).map(r=>({...r,for:'adult'})).concat(d.rewards.filter(r=>r.for==='child'));d.events.push({id:uid(),text:'Dati precedenti importati',at:Date.now()});}catch(e){}return d;}
function load(){try{let s=localStorage.getItem(KEY);if(s)return JSON.parse(s);let old=localStorage.getItem(OLD);if(old)return migrateOld(JSON.parse(old));}catch(e){}return defaults();}
let S=load(),tab='home',filter='adult',rankView='week',editTasks=false,editRewards=false;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function person(id){return S.people.find(p=>p.id===id)||{name:'Persona',type:'adult'}}
function current(){return person(S.current)}
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100)}
function logEvent(text){S.events.unshift({id:uid(),text,at:Date.now()});}
function settleWeeks(){if(!S.settledWeeks)S.settledWeeks=[];let first=S.approved.length?Math.min(...S.approved.map(x=>x.week||monday(x.at))):monday(Date.now());for(let w=first;w<monday(Date.now());w+=7*86400000){if(S.settledWeeks.includes(w))continue;let adults=S.people.filter(p=>p.type==='adult');if(adults.length>1){let rows=adults.map(p=>({id:p.id,pts:S.approved.filter(x=>x.by===p.id&&x.week===w&&!x.kind).reduce((a,x)=>a+x.points,0),tasks:new Set(S.approved.filter(x=>x.by===p.id&&x.week===w&&!x.kind).map(x=>x.taskId)).size}));let max=Math.max(0,...rows.map(x=>x.pts));if(max>0){let top=rows.filter(x=>x.pts===max),best=Math.max(...top.map(x=>x.tasks));top=top.filter(x=>x.tasks===best);top.forEach(x=>S.approved.push({id:uid(),name:'Bonus classifica settimanale',points:S.settings.weeklyBonus,by:x.id,at:w+6*86400000+86399000,week:w,kind:'bonus'}));}}S.settledWeeks.push(w);} }
function totals(id){let approved=S.approved.filter(x=>x.by===id),earned=approved.reduce((a,x)=>a+x.points,0),spent=S.redeems.filter(x=>x.by===id).reduce((a,x)=>a+x.cost,0),week=approved.filter(x=>x.week===monday(Date.now())).reduce((a,x)=>a+x.points,0);return {earned,spent,balance:earned-spent,week,count:approved.length};}
function teamPoints(){return S.approved.filter(x=>x.week===monday(Date.now())).reduce((a,x)=>a+x.points,0)}
function childTarget(p){return p.age<=7?S.settings.childTargets.small:p.age<=11?S.settings.childTargets.medium:S.settings.childTargets.teen}
function weeklyRank(type){return S.people.filter(p=>p.type===type).map(p=>({p,...totals(p.id)})).sort((a,b)=>type==='child'?(b.week/Math.max(1,childTarget(b.p))-a.week/Math.max(1,childTarget(a.p))):(b.week-a.week));}
function openModal(content){document.querySelector('#sheet').innerHTML=content;document.querySelector('#modal').classList.add('open')}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const navItems=[['home','⌂','Casa'],['tasks','✓','Faccende'],['approvals','◷','Conferme'],['rank','♛','Classifiche'],['rewards','☆','Premi'],['history','≡','Storico']];
function renderNav(){document.querySelector('#nav').innerHTML=navItems.map(([id,ic,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span>${ic}</span>${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function profileBar(){return `<div class="profiles">${S.people.map(p=>`<button class="profile ${p.id===S.current?'active':''}" data-profile="${p.id}">${p.type==='child'?'🧒':'●'} ${esc(p.name)}</button>`).join('')}<button class="profile" id="addPerson">＋</button></div>`}
function header(title,desc){return `<p class="eyebrow">CASA CLUB · ${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</p><h1>${title}</h1><p class="sub">${desc}</p>`}
function render(){settleWeeks();renderNav();let p=current(),t=totals(p.id),html=profileBar();
if(tab==='home'){
 let tp=teamPoints(),goal=S.team.goal,pct=Math.min(100,Math.round(tp/Math.max(1,goal)*100));
 html+=header('La casa è una squadra.','Ogni gesto conta. Piccoli contributi, grandi risultati.');
 html+=`<div class="card"><div class="row"><div><div class="eyebrow">Punti disponibili · ${esc(p.name)}</div><div class="big">${t.balance}</div><div class="sub">${t.earned} guadagnati · ${t.spent} spesi</div></div><div class="avatar">${p.type==='child'?'★':'✦'}</div></div></div>`;
 html+=`<div class="card"><div class="row"><div><div class="eyebrow">Obiettivo squadra · questa settimana</div><h2 style="margin:0">${tp} / ${goal} punti</h2></div><span class="pill">${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="sub">${pct>=100?'Obiettivo raggiunto! Premio famiglia sbloccato 🎉':`Mancano ${Math.max(0,goal-tp)} punti al premio comune.`}</div><div class="sub" style="margin-top:6px">Premio: ${esc(S.team.prize)}</div></div>`;
 html+=`<div class="grid2"><div class="card"><div class="eyebrow">Le tue attività</div><div class="big">${t.week}</div><div class="sub">punti approvati questa settimana</div></div><div class="card"><div class="eyebrow">In attesa di conferma</div><div class="big">${S.pending.filter(x=>x.by===p.id).length}</div><div class="sub">attività da approvare</div></div></div>`;
 html+=`<h2>Da fare adesso</h2><button class="btn" id="goTasks">＋ Segna una faccenda</button><h2>In attesa di approvazione</h2>`;
 let pend=S.pending.filter(x=>x.by===p.id);html+=pend.length?pend.slice(0,3).map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${x.points} punti · in attesa di ${esc(person(x.reviewer).name)}</div></div>`).join(''):`<div class="card empty">Nessuna attività in attesa per ${esc(p.name)}.</div>`;
}
if(tab==='tasks'){
 html+=header('Faccende','Segna ciò che hai completato. Un altro componente dovrà confermarlo.');
 html+=`<div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Figli</button><button class="btn ghost" id="toggleTaskEdit">${editTasks?'Fine modifica':'Modifica elenco'}</button></div>`;
 let groups=[...new Set(S.tasks.filter(x=>x.for===filter).map(x=>x.group))];
 groups.forEach(g=>{html+=`<h2>${esc(g)}</h2>`;S.tasks.filter(x=>x.for===filter&&x.group===g).forEach(x=>{html+=editTasks?`<div class="listrow"><div style="flex:1"><input data-taskname="${x.id}" value="${esc(x.name)}"></div><input style="width:75px" type="number" min="1" data-taskpts="${x.id}" value="${x.points}"><button class="btn danger" data-taskdel="${x.id}">×</button></div>`:`<button class="task" data-task="${x.id}"><span><b>${esc(x.name)}</b><small>${filter==='child'?'Attività adatta ai bambini':'Attività per adulti'}</small></span><span class="pts">+${x.points} pt　＋</span></button>`})});
 if(editTasks)html+=`<div class="card"><h3>Nuova attività</h3><label>Nome</label><input id="newTaskName" placeholder="Es. Sistemare la dispensa"><div class="fieldrow"><div><label>Categoria</label><input id="newTaskGroup" value="Altro"></div><div><label>Punti</label><input id="newTaskPts" type="number" value="5" min="1"></div></div><button class="btn" id="saveTask" style="margin-top:12px">Aggiungi</button></div>`;
}
if(tab==='approvals'){
 html+=header('Conferme','Ogni attività viene validata da una persona diversa da chi l’ha svolta.');
 let inbox=S.pending.filter(x=>x.reviewer===p.id);
 html+=`<h2>Da verificare per ${esc(p.name)} (${inbox.length})</h2>`;
 html+=inbox.length?inbox.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.name)}</b><div class="sub">${esc(person(x.by).name)} · ${x.points} punti · ${fmt(x.at)}</div></div><span class="pill">Da confermare</span></div><div class="wrap" style="margin-top:12px"><button class="btn" data-approve="${x.id}">Conferma</button><button class="btn secondary" data-partial="${x.id}">Conferma al 50%</button><button class="btn danger" data-reject="${x.id}">Rifiuta</button></div></div>`).join(''):`<div class="card empty">Non ci sono attività da verificare.</div>`;
 let mine=S.pending.filter(x=>x.by===p.id);html+=`<h2>Le tue attività in attesa (${mine.length})</h2>`+(mine.length?mine.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${x.points} punti · verifica di ${esc(person(x.reviewer).name)}</div></div>`).join(''):`<div class="card empty">Tutto aggiornato.</div>`);
 html+=`<h2>Ultimi rifiuti</h2>`+(S.rejected.length?S.rejected.slice(-5).reverse().map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${esc(person(x.by).name)} · ${esc(x.reason||'Nessuna motivazione')}</div><button class="btn secondary" data-resubmit="${x.id}">Correggi e reinvia</button></div>`).join(''):`<div class="sub">Nessun rifiuto recente.</div>`);
}
if(tab==='rank'){
 html+=header('Classifiche','Due sfide separate: adulti e figli. I bambini competono in base al proprio obiettivo.');
 html+=`<div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Figli</button><button class="btn ${rankView==='week'?'':'ghost'}" data-rank="week">Settimana</button><button class="btn ${rankView==='all'?'':'ghost'}" data-rank="all">Totale</button></div>`;
 let rows=filter==='child'?weeklyRank('child'):weeklyRank('adult');if(rankView==='all')rows=rows.map(x=>({...x,score:x.earned})).sort((a,b)=>b.earned-a.earned);
 html+=rows.length?rows.map((x,i)=>{let score=rankView==='all'?x.earned:(filter==='child'?Math.round(x.week/Math.max(1,childTarget(x.p))*100):x.week);return `<div class="card"><div class="row"><div class="wrap"><span class="rank">${i+1}</span><div><b>${esc(x.p.name)}</b><div class="sub">${filter==='child'?`${x.week}/${childTarget(x.p)} punti obiettivo`:`${x.week} punti questa settimana`}</div></div></div><span class="pill">${rankView==='all'?x.earned+' pt':filter==='child'?score+'%':score+' pt'}</span></div>${filter==='child'&&rankView==='week'?`<div class="progress"><i style="width:${Math.min(100,score)}%"></i></div>`:''}<div class="sub">Totale storico: ${x.earned} · Saldo: ${x.balance}</div></div>`}).join(''):`<div class="card empty">Aggiungi un partecipante di questo gruppo per iniziare.</div>`;
 if(filter==='adult'&&rankView==='week'&&rows.length>1)html+=`<div class="notice">Il vincitore settimanale riceve +${S.settings.weeklyBonus} punti. Nessuna penalità automatica per l’ultimo. In caso di parità si contano le attività distinte.</div>`;
 if(filter==='child')html+=`<div class="notice">Obiettivi settimanali personalizzati per fascia d’età. Le attività devono essere sicure e adeguate all’età, con supervisione adulta quando serve.</div>`;
}
if(tab==='rewards'){
 html+=header('Premi','Riscatta i punti per piccoli privilegi e momenti speciali.');
 html+=`<div class="card"><div class="eyebrow">Saldo di ${esc(p.name)}</div><div class="big">${t.balance} <span class="sub">punti</span></div></div><div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Premi adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Premi figli</button><button class="btn ghost" id="toggleRewardEdit">${editRewards?'Fine modifica':'Modifica premi'}</button></div>`;
 S.rewards.filter(r=>r.for===filter).sort((a,b)=>a.cost-b.cost).forEach(r=>{let used=S.redeems.some(x=>x.by===p.id&&x.rewardId===r.id&&x.week===monday(Date.now())),can=p.type===filter&&t.balance>=r.cost&&!used&&S.redeems.filter(x=>x.by===p.id&&x.week===monday(Date.now())).length<S.settings.maxRedeems;
 html+=editRewards?`<div class="listrow"><input data-rewardname="${r.id}" value="${esc(r.name)}"><input style="width:80px" type="number" data-rewardcost="${r.id}" value="${r.cost}"><button class="btn danger" data-rewarddel="${r.id}">×</button></div>`:`<div class="card row"><div style="flex:1"><b>${esc(r.name)}</b><div class="sub">${r.cost} punti ${used?'· Già riscattato questa settimana':''}</div></div><button class="btn" data-redeem="${r.id}" ${can?'':'disabled'}>${used?'Già preso':t.balance<r.cost?'Non bastano':p.type!==filter?'Profilo diverso':'Riscatta'}</button></div>`});
 if(editRewards)html+=`<div class="card"><h3>Nuovo premio (${filter==='adult'?'adulti':'figli'})</h3><input id="newRewardName" placeholder="Nome premio"><div class="fieldrow"><input id="newRewardCost" type="number" min="1" value="50"><button class="btn" id="saveReward">Aggiungi</button></div></div>`;
 html+=`<div class="sub">Limite attuale: ${S.settings.maxRedeems} riscatti a settimana per persona. I premi che richiedono il lavoro di un altro componente vanno concordati.</div>`;
}
if(tab==='history'){
 html+=header('Storico','Tutte le attività approvate, i premi riscattati e le modifiche.');
 let entries=[...S.approved.map(x=>({...x,kind:'ok'})),...S.pending.map(x=>({...x,kind:'wait'})),...S.redeems.map(x=>({...x,kind:'reward',at:x.at||Date.now()})),...S.events.map(x=>({...x,kind:'event'}))].sort((a,b)=>b.at-a.at);
 html+=entries.length?entries.slice(0,100).map(x=>`<div class="listrow"><div><b>${esc(x.name||x.text)}</b><div class="sub">${esc(person(x.by).name||'Sistema')} · ${fmt(x.at)} · ${x.kind==='ok'?'Approvata':x.kind==='wait'?'In attesa':x.kind==='reward'?'Premio riscattato':'Registro'}</div></div>${x.kind==='ok'?`<span class="pill">+${x.points}</span>`:x.kind==='reward'?`<span class="pill">−${x.cost}</span>`:''}</div>`).join(''):`<div class="card empty">Lo storico è ancora vuoto.</div>`;
}
if(tab==='settings'){
 html+=header('Impostazioni','Gestisci componenti, obiettivi e regole di CASA CLUB.');
 html+=`<h2>Componenti della famiglia</h2><div class="card">${S.people.map(x=>`<div class="listrow"><div style="flex:1"><input data-personname="${x.id}" value="${esc(x.name)}"><div class="sub">${x.type==='child'?'Figlio':'Adulto'} · ${x.age} anni</div></div><button class="btn ghost" data-personedit="${x.id}">Modifica</button></div>`).join('')}<button class="btn secondary" id="addPerson2" style="margin-top:10px">＋ Aggiungi componente</button></div>`;
 html+=`<h2>Obiettivo squadra</h2><div class="card"><label>Punti settimanali</label><input id="teamGoal" type="number" min="1" value="${S.team.goal}"><label>Premio comune</label><input id="teamPrize" value="${esc(S.team.prize)}"><button class="btn" id="saveTeam" style="margin-top:10px">Salva obiettivo</button></div>`;
 html+=`<h2>Regole</h2><div class="card"><label>Bonus al vincitore adulti</label><input id="bonus" type="number" value="${S.settings.weeklyBonus}"><label>Numero massimo di premi riscattabili a settimana per persona</label><input id="maxRedeems" type="number" min="1" max="10" value="${S.settings.maxRedeems}"><button class="btn" id="saveRules" style="margin-top:10px">Salva regole</button><div class="notice">Nessuna multa o punti negativi. La penitenza dell’ultimo è facoltativa e non viene applicata automaticamente.</div></div>`;
 html+=`<h2>Backup e ripristino</h2><div class="card"><p class="sub">I dati sono salvati solo in questo browser/dispositivo. Esporta periodicamente una copia di sicurezza.</p><div class="wrap"><button class="btn secondary" id="export">Esporta backup</button><label class="btn ghost" style="margin:0">Importa backup<input id="import" type="file" accept="application/json" hidden></label><button class="btn danger" id="reset">Azzera dati</button></div></div>`;
}
document.querySelector('#app').innerHTML=html;
document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{S.current=b.dataset.profile;save();render()});
document.querySelector('#settingsShortcut').onclick=()=>{tab='settings';render()};
document.querySelector('#goTasks')?.addEventListener('click',()=>{tab='tasks';render()});
document.querySelector('#addPerson')?.addEventListener('click',()=>personForm());
document.querySelector('#addPerson2')?.addEventListener('click',()=>personForm());
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{rankView=b.dataset.rank;render()});
document.querySelector('#toggleTaskEdit')?.addEventListener('click',()=>{editTasks=!editTasks;render()});
document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskForm(b.dataset.task));
document.querySelector('#saveTask')?.addEventListener('click',()=>{let name=document.querySelector('#newTaskName').value.trim(),points=+document.querySelector('#newTaskPts').value,group=document.querySelector('#newTaskGroup').value.trim()||'Altro';if(!name||points<1)return toast('Inserisci nome e punti validi');S.tasks.push({id:uid(),name,points,group,for:filter});logEvent('Nuova attività: '+name);save();render()});
document.querySelectorAll('[data-taskname]').forEach(i=>i.onchange=()=>{let x=S.tasks.find(t=>t.id===i.dataset.taskname);if(x&&i.value.trim())x.name=i.value.trim();save()});
document.querySelectorAll('[data-taskpts]').forEach(i=>i.onchange=()=>{let x=S.tasks.find(t=>t.id===i.dataset.taskpts);if(x&&+i.value>0)x.points=+i.value;save()});
document.querySelectorAll('[data-taskdel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questa attività?')){S.tasks=S.tasks.filter(x=>x.id!==b.dataset.taskdel);save();render()}});
document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(b.dataset.approve,'approved',1));
document.querySelectorAll('[data-partial]').forEach(b=>b.onclick=()=>decide(b.dataset.partial,'approved',.5));
document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{let id=b.dataset.reject,x=S.pending.find(y=>y.id===id);openModal(`<h2>Motivo del rifiuto</h2><p class="sub">Spiega cosa va corretto prima di reinviare.</p><input id="rejectReason" placeholder="Es. Attività non completata"><div class="wrap" style="margin-top:15px"><button class="btn danger" id="confirmReject">Conferma rifiuto</button><button class="btn ghost" onclick="closeModal()">Annulla</button></div>`);document.querySelector('#confirmReject').onclick=()=>{x.reason=document.querySelector('#rejectReason').value.trim()||'Da verificare';S.pending=S.pending.filter(y=>y.id!==id);S.rejected.push(x);logEvent('Attività rifiutata: '+x.name);save();closeModal();render()}});
document.querySelectorAll('[data-resubmit]').forEach(b=>b.onclick=()=>{let x=S.rejected.find(y=>y.id===b.dataset.resubmit);if(!x)return;let others=S.people.filter(y=>y.id!==x.by);if(!others.length)return toast('Aggiungi un altro componente per approvare');openModal(`<h2>Correggi e reinvia</h2><p>${esc(x.name)} · ${x.points} punti</p><label>Nuovo verificatore</label><select id="newReviewer">${others.map(y=>`<option value="${y.id}">${esc(y.name)}</option>`).join('')}</select><button class="btn" id="resubmitNow" style="margin-top:14px">Invia di nuovo</button>`);document.querySelector('#resubmitNow').onclick=()=>{x.reviewer=document.querySelector('#newReviewer').value;x.at=Date.now();delete x.reason;S.rejected=S.rejected.filter(y=>y.id!==x.id);S.pending.push(x);save();closeModal();render()}});
document.querySelector('#toggleRewardEdit')?.addEventListener('click',()=>{editRewards=!editRewards;render()});
document.querySelector('#saveReward')?.addEventListener('click',()=>{let name=document.querySelector('#newRewardName').value.trim(),cost=+document.querySelector('#newRewardCost').value;if(!name||cost<1)return toast('Inserisci nome e costo');S.rewards.push({id:uid(),name,cost,for:filter});save();render()});
document.querySelectorAll('[data-rewardname]').forEach(i=>i.onchange=()=>{let r=S.rewards.find(x=>x.id===i.dataset.rewardname);if(r&&i.value.trim())r.name=i.value.trim();save()});
document.querySelectorAll('[data-rewardcost]').forEach(i=>i.onchange=()=>{let r=S.rewards.find(x=>x.id===i.dataset.rewardcost);if(r&&+i.value>0)r.cost=+i.value;save()});
document.querySelectorAll('[data-rewarddel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questo premio?')){S.rewards=S.rewards.filter(x=>x.id!==b.dataset.rewarddel);save();render()}});
document.querySelectorAll('[data-redeem]').forEach(b=>b.onclick=()=>{let r=S.rewards.find(x=>x.id===b.dataset.redeem),p=current(),t=totals(p.id);if(p.type!==r.for||t.balance<r.cost)return;if(S.redeems.filter(x=>x.by===p.id&&x.week===monday(Date.now())).length>=S.settings.maxRedeems)return toast('Hai raggiunto il limite settimanale');if(S.redeems.some(x=>x.by===p.id&&x.rewardId===r.id&&x.week===monday(Date.now())))return toast('Premio già riscattato questa settimana');if(!confirm(`Riscattare "${r.name}" per ${r.cost} punti?`))return;S.redeems.push({id:uid(),rewardId:r.id,name:r.name,cost:r.cost,by:p.id,for:r.for,at:Date.now(),week:monday(Date.now())});logEvent(p.name+' ha riscattato: '+r.name);save();render();toast('Premio riscattato!')});
document.querySelector('#saveTeam')?.addEventListener('click',()=>{S.team.goal=Math.max(1,+document.querySelector('#teamGoal').value||1);S.team.prize=document.querySelector('#teamPrize').value.trim()||'Premio famiglia';save();render();toast('Obiettivo aggiornato')});
document.querySelector('#saveRules')?.addEventListener('click',()=>{S.settings.weeklyBonus=Math.max(0,+document.querySelector('#bonus').value||0);S.settings.maxRedeems=Math.min(10,Math.max(1,+document.querySelector('#maxRedeems').value||2));save();render();toast('Regole aggiornate')});
document.querySelectorAll('[data-personname]').forEach(i=>i.onchange=()=>{let p=S.people.find(x=>x.id===i.dataset.personname);if(p&&i.value.trim())p.name=i.value.trim();save()});
document.querySelectorAll('[data-personedit]').forEach(b=>b.onclick=()=>personForm(b.dataset.personedit));
document.querySelector('#export')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='casa-club-backup.json';a.click();URL.revokeObjectURL(a.href)});
document.querySelector('#import')?.addEventListener('change',async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.people||!obj.tasks)throw Error();if(confirm('Sostituire i dati attuali con il backup?')){S=obj;save();render();toast('Backup importato')}}catch(err){toast('File di backup non valido')}});
document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('Cancellare tutti i dati locali? Questa operazione non si può annullare.')){S=defaults();save();render()}});
}
function personForm(id){let p=id?person(id):{name:'',type:'adult',age:30},editing=!!id;openModal(`<h2>${editing?'Modifica componente':'Aggiungi componente'}</h2><label>Nome</label><input id="personName" value="${esc(p.name)}" placeholder="Nome"><label>Gruppo</label><select id="personType"><option value="adult" ${p.type==='adult'?'selected':''}>Adulto</option><option value="child" ${p.type==='child'?'selected':''}>Figlio</option></select><label>Età</label><input id="personAge" type="number" min="1" max="99" value="${p.age||8}"><div class="wrap" style="margin-top:15px"><button class="btn" id="savePerson">Salva</button><button class="btn ghost" onclick="closeModal()">Annulla</button>${editing?`<button class="btn danger" id="deletePerson">Elimina</button>`:''}</div>`);document.querySelector('#savePerson').onclick=()=>{let name=document.querySelector('#personName').value.trim(),type=document.querySelector('#personType').value,age=Math.max(1,+document.querySelector('#personAge').value||1);if(!name)return toast('Inserisci un nome');if(editing)Object.assign(p,{name,type,age});else{p={id:uid(),name,type,age};S.people.push(p);S.current=p.id}logEvent((editing?'Modificato: ':'Aggiunto: ')+name);save();closeModal();render()};document.querySelector('#deletePerson')?.addEventListener('click',()=>{if(S.people.length<=1)return toast('Deve restare almeno una persona');if(confirm('Eliminare questo profilo?')){S.people=S.people.filter(x=>x.id!==id);if(S.current===id)S.current=S.people[0].id;save();closeModal();render()}})}
function taskForm(taskId){let task=S.tasks.find(x=>x.id===taskId),p=current(),others=S.people.filter(x=>x.id!==p.id);if(task.for!==p.type)return toast(task.for==='child'?'Seleziona prima il profilo del figlio.':'Seleziona prima un profilo adulto.');if(!others.length)return toast('Aggiungi un altro componente per approvare le attività');openModal(`<h2>Segna attività completata</h2><p><b>${esc(task.name)}</b> · ${task.points} punti</p><p class="sub">L’attività sarà conteggiata solo dopo la conferma di un altro componente.</p><label>Chi conferma?</label><select id="reviewer">${others.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label>Data di completamento</label><input type="date" id="taskDate" value="${new Date().toISOString().slice(0,10)}"><div class="wrap" style="margin-top:15px"><button class="btn" id="sendTask">Invia per conferma</button><button class="btn ghost" onclick="closeModal()">Annulla</button></div>`);document.querySelector('#sendTask').onclick=()=>{let reviewer=document.querySelector('#reviewer').value,date=new Date(document.querySelector('#taskDate').value+'T12:00:00');if(!reviewer||isNaN(+date))return toast('Controlla i dati');S.pending.push({id:uid(),taskId:task.id,name:task.name,points:task.points,by:p.id,reviewer,at:+date,week:monday(+date)});logEvent(p.name+' ha inviato: '+task.name);save();closeModal();render();toast('Inviata per approvazione')}}
function decide(id,target,factor){let x=S.pending.find(y=>y.id===id);if(!x)return;if(x.reviewer!==S.current)return toast('Solo il verificatore indicato può approvare questa attività.');S.pending=S.pending.filter(y=>y.id!==id);if(target==='approved'){let pts=Math.round(x.points*factor);S.approved.push({...x,points:pts,approvedBy:S.current,approvedAt:Date.now(),partial:factor<1});logEvent(`${person(x.reviewer).name} ha approvato ${x.name} (${pts} pt)`);if(factor<1)toast('Confermata al 50%')}save();render()}
S=load();if(!S.team)S.team=defaults().team;if(!S.settings)S.settings=defaults().settings;if(!S.pending)S.pending=[];if(!S.approved)S.approved=[];if(!S.rejected)S.rejected=[];if(!S.events)S.events=[];if(!S.settledWeeks)S.settledWeeks=[];if(!S.people?.length)S.people=defaults().people;if(!S.current||!S.people.some(x=>x.id===S.current))S.current=S.people[0].id;save();render();
</script>
</body></html>
